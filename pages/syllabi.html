<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="内外妇儿传、口腔、全科、医学心理学、眼科学课程大纲，按课程查阅学习要求、重点与难点。" name="description"/>
<title>课程大纲 | stat notes-online</title><style>
:root {
  color-scheme: light;
  --bg: #faf7f2;
  --surface: #fffdf8;
  --surface-muted: #fffaf5;
  --surface-strong: #f5efe7;
  --text: #24211d;
  --muted: #706a61;
  --soft: #8a8176;
  --line: #e6dbce;
  --accent: #b45f3c;
  --accent-strong: #8f4528;
  --accent-soft: #f8e7dc;
  --footer-bg: #f1e8de;
  --footer-text: #704832;
  --warning-bg: #fff3da;
  --warning-text: #7a4d00;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background:
    repeating-linear-gradient(0deg, rgba(180, 95, 60, 0.018) 0, rgba(180, 95, 60, 0.018) 1px, transparent 1px, transparent 44px),
    var(--bg);
  color: var(--text);
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  line-height: 1.6;
}

a {
  color: inherit;
}

.site-header {
  border-bottom: 1px solid rgba(230, 219, 206, 0.6);
}

.header-inner,
.main-content,
.site-footer {
  width: min(1248px, calc(100% - 48px));
  margin: 0 auto;
}

.header-inner {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 28px;
  align-items: start;
  padding: 72px 0 32px;
}

.site-title {
  margin: 0;
  font-family: ui-serif, Georgia, "Times New Roman", serif;
  font-size: clamp(2.45rem, 6vw, 4.25rem);
  font-weight: 800;
  line-height: 0.98;
  letter-spacing: 0;
}

.site-kicker {
  margin: 18px 0 0;
  color: var(--muted);
  font-size: clamp(1.2rem, 2.5vw, 1.9rem);
  font-weight: 800;
  line-height: 1.25;
}

.site-subtitle {
  max-width: 720px;
  margin: 6px 0 0;
  color: var(--soft);
  font-size: clamp(1rem, 2vw, 1.28rem);
}

.library-stats {
  min-width: 290px;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 20px 28px;
  background: rgba(255, 250, 245, 0.72);
}

.library-stats strong,
.library-stats span {
  display: block;
}

.library-stats strong {
  color: var(--accent-strong);
  font-size: 1.08rem;
}

.library-stats span {
  margin-top: 4px;
  color: var(--muted);
  font-size: 0.98rem;
}

.main-content {
  padding: 28px 0 40px;
}

.site-switcher {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 28px;
}

.switcher-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 52px;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 0 22px;
  background: var(--surface);
  color: var(--accent-strong);
  font-size: 1.02rem;
  font-weight: 850;
  text-decoration: none;
  transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
}

.switcher-link:hover,
.switcher-link:focus-visible,
.switcher-link.is-active {
  border-color: transparent;
  background: var(--accent);
  color: #fffaf4;
  outline: none;
}

.switcher-link:focus-visible {
  outline: 3px solid rgba(180, 95, 60, 0.22);
}

.course-nav {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 40px;
  border: 1px solid var(--line);
  border-radius: 26px;
  padding: 14px 26px;
  background: rgba(255, 250, 245, 0.8);
  overflow-x: auto;
}

.course-nav-label {
  flex: 0 0 auto;
  color: var(--muted);
  font-size: 1.12rem;
  font-weight: 800;
  white-space: nowrap;
}

.course-tabs {
  display: flex;
  gap: 14px;
  min-width: max-content;
}

.course-tab {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  min-width: 180px;
  min-height: 62px;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 0 22px;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  font: inherit;
  font-size: 1.08rem;
  font-weight: 800;
  transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
}

.course-tab strong {
  color: var(--soft);
  font-size: 1.05rem;
}

.course-tab:hover,
.course-tab:focus-visible {
  border-color: var(--accent);
  outline: none;
}

.course-tab.is-active {
  border-color: transparent;
  background: var(--accent);
  color: #fffaf4;
}

.course-tab.is-active strong {
  color: var(--accent-soft);
}

.status,
.course-panel {
  border: 1px solid var(--line);
  border-radius: 28px;
  background: rgba(255, 250, 245, 0.78);
}

.status {
  padding: 28px;
  color: var(--muted);
}

.status.warning {
  border-color: #f3d19c;
  background: var(--warning-bg);
  color: var(--warning-text);
}

.course-panel {
  min-height: 760px;
  padding: 38px;
}

.panel-summary {
  display: flex;
  justify-content: flex-end;
  min-height: 28px;
  margin-bottom: 16px;
  color: var(--muted);
  font-size: 1.02rem;
  font-weight: 800;
}

.course-search {
  width: 100%;
  min-height: 66px;
  margin-bottom: 44px;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px 28px;
  color: var(--text);
  background: var(--surface);
  font: inherit;
  font-size: 1.18rem;
}

.course-search::placeholder {
  color: #9b9389;
}

.course-search:focus {
  border-color: var(--accent);
  outline: 3px solid rgba(180, 95, 60, 0.16);
}

.course-empty {
  margin: 16px 0 0;
  color: var(--muted);
  font-size: 1rem;
}

.banks-toolbar {
  margin-bottom: 28px;
}

.search-label {
  display: block;
  margin: 0 0 10px;
  color: var(--muted);
  font-size: 1rem;
  font-weight: 850;
}

.bank-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 28px;
}

.bank-card {
  display: flex;
  flex-direction: column;
  gap: 16px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--surface);
  padding: 28px;
}

.bank-card.is-collection {
  min-height: 0;
}

.bank-meta {
  display: grid;
  gap: 8px;
  margin: 0;
  color: var(--soft);
  font-size: 0.96rem;
}

.bank-meta div {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr);
  gap: 10px;
}

.bank-meta dt,
.bank-meta dd {
  margin: 0;
}

.bank-meta dt {
  color: var(--muted);
  font-weight: 850;
}

.bank-meta.is-compact {
  margin-top: 10px;
  font-size: 0.9rem;
}

.bank-collection-detail {
  margin-top: 8px;
}

.bank-chapter-list {
  display: grid;
  max-height: 560px;
  overflow-y: auto;
}

.bank-chapter {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(220px, 320px);
  gap: 16px;
  align-items: center;
  border-bottom: 1px solid rgba(230, 219, 206, 0.7);
  padding: 14px 16px;
}

.bank-chapter:last-child {
  border-bottom: 0;
}

.bank-chapter h3 {
  margin: 0;
  color: var(--text);
  font-size: 1rem;
  line-height: 1.45;
}

.bank-code-block {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 44px;
  gap: 8px;
  align-items: center;
  margin-top: auto;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 6px;
  background: var(--surface-muted);
}

.bank-code {
  min-width: 0;
  overflow-wrap: anywhere;
  padding: 0 8px;
  color: var(--text);
  font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font-size: 1.05rem;
  font-weight: 850;
}

.copy-code-button {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0;
  background: var(--surface);
  color: var(--accent-strong);
  cursor: pointer;
  transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
}

.copy-code-button:hover,
.copy-code-button:focus-visible {
  border-color: transparent;
  background: var(--accent);
  color: #fffaf4;
  outline: none;
}

.copy-code-button:focus-visible {
  outline: 3px solid rgba(180, 95, 60, 0.22);
}

.copy-code-button.is-copied {
  border-color: transparent;
  background: var(--accent-strong);
  color: #fffaf4;
}

.copy-icon {
  position: relative;
  width: 18px;
  height: 18px;
}

.copy-icon::before,
.copy-icon::after {
  content: "";
  position: absolute;
  width: 12px;
  height: 12px;
  border: 2px solid currentColor;
  border-radius: 3px;
  background: transparent;
}

.copy-icon::before {
  top: 1px;
  left: 5px;
  opacity: 0.55;
}

.copy-icon::after {
  right: 5px;
  bottom: 1px;
}

.copy-feedback {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
}

.bank-qr {
  width: min(180px, 100%);
  aspect-ratio: 1;
  border: 1px solid var(--line);
  border-radius: 16px;
  object-fit: contain;
  background: #fff;
  padding: 10px;
}

.back-link {
  display: inline-flex;
  margin-bottom: 20px;
  color: var(--accent-strong);
  font-size: 1rem;
  font-weight: 850;
  text-decoration: none;
}

.back-link:hover,
.back-link:focus-visible {
  text-decoration: underline;
  outline: none;
}

.file-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 34px;
}

.file-card {
  display: flex;
  flex-direction: column;
  min-height: 344px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--surface);
  padding: 28px;
}

.file-card.is-collection {
  min-height: 380px;
}

.card-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.file-title {
  margin: 0;
  color: var(--text);
  font-size: 1.28rem;
  font-weight: 850;
  line-height: 1.35;
}

.collection-badge {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 10px;
  background: var(--surface-strong);
  color: var(--accent-strong);
  font-size: 0.82rem;
  font-weight: 850;
  white-space: nowrap;
}

.description {
  margin: 10px 0 16px;
  color: var(--muted);
  font-size: 1rem;
}

.meta {
  display: grid;
  gap: 2px;
  margin: 0 0 14px;
  color: var(--soft);
  font-size: 0.95rem;
}

.meta div {
  display: flex;
  gap: 6px;
}

.meta dt,
.meta dd {
  margin: 0;
}

.download-block {
  margin-top: auto;
}

.download-label {
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 0.96rem;
  font-weight: 850;
}

.download-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.collection-detail {
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface-muted);
  overflow: hidden;
}

.collection-detail summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  min-height: 56px;
  padding: 0 18px;
  color: var(--accent-strong);
  cursor: pointer;
  font-weight: 850;
  list-style: none;
}

.collection-detail summary::-webkit-details-marker {
  display: none;
}

.collection-detail summary::after {
  content: "+";
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent-strong);
}

.collection-detail[open] summary {
  border-bottom: 1px solid var(--line);
}

.collection-detail[open] summary::after {
  content: "-";
}

.collection-detail summary strong {
  margin-left: auto;
  color: var(--soft);
  font-size: 0.92rem;
}

.chapter-list {
  display: grid;
  max-height: 360px;
  overflow-y: auto;
}

.chapter-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  min-height: 58px;
  border-bottom: 1px solid rgba(230, 219, 206, 0.7);
  padding: 10px 14px 10px 18px;
  color: var(--text);
}

.chapter-row:last-child {
  border-bottom: 0;
}

.chapter-row span {
  min-width: 0;
  overflow-wrap: anywhere;
}

.chapter-actions {
  display: flex;
  flex: 0 0 auto;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}

.chapter-format-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 62px;
  min-height: 40px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 7px 14px;
  background: var(--surface);
  color: var(--accent-strong);
  font-size: 0.88rem;
  font-weight: 850;
  line-height: 1;
  text-decoration: none;
  transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
}

.chapter-format-button:hover,
.chapter-format-button:focus-visible {
  border-color: transparent;
  background: var(--accent);
  color: #fffaf4;
  outline: none;
}

.chapter-format-button:focus-visible {
  outline: 3px solid rgba(180, 95, 60, 0.22);
}

.chapter-format-button.is-pdf {
  border-color: transparent;
  background: var(--accent);
  color: #fffaf4;
}

.chapter-format-button.is-pdf:hover,
.chapter-format-button.is-pdf:focus-visible {
  background: var(--accent-strong);
}

.chapter-format-button strong {
  flex: 0 0 auto;
  color: var(--accent-strong);
  font-size: 0.88rem;
}

.collection-empty {
  margin: 0;
  color: var(--muted);
}

.download-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 128px;
  min-height: 48px;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 9px 20px;
  background: var(--surface-strong);
  color: var(--accent-strong);
  font-weight: 850;
  text-decoration: none;
  transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
}

.download-link.is-primary,
.download-link:hover,
.download-link:focus-visible {
  border-color: transparent;
  background: var(--accent);
  color: #fffaf4;
  outline: none;
}

.download-link:focus-visible {
  outline: 3px solid rgba(180, 95, 60, 0.22);
}

.admin-notice,
.admin-toolbar,
.admin-import,
.admin-output,
.admin-list-panel,
.admin-editor-panel {
  border: 1px solid var(--line);
  border-radius: 22px;
  background: rgba(255, 250, 245, 0.78);
}

.admin-notice {
  display: grid;
  gap: 4px;
  margin-bottom: 20px;
  padding: 20px 24px;
  color: var(--muted);
}

.admin-notice strong {
  color: var(--accent-strong);
  font-size: 1.04rem;
}

.admin-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
  padding: 16px;
}

.admin-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 46px;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 8px 16px;
  background: var(--surface);
  color: var(--accent-strong);
  cursor: pointer;
  font: inherit;
  font-weight: 850;
  transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
}

.admin-button:hover,
.admin-button:focus-visible,
.admin-button.is-primary {
  border-color: transparent;
  background: var(--accent);
  color: #fffaf4;
  outline: none;
}

.admin-button:focus-visible {
  outline: 3px solid rgba(180, 95, 60, 0.22);
}

.admin-button.is-danger {
  color: #9f3326;
}

.admin-button.is-danger:hover,
.admin-button.is-danger:focus-visible {
  background: #9f3326;
  color: #fffaf4;
}

.admin-import,
.admin-output {
  display: grid;
  gap: 12px;
  margin-bottom: 20px;
  padding: 20px;
}

.admin-layout {
  display: grid;
  grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
  gap: 24px;
  margin: 20px 0;
}

.admin-list-panel,
.admin-editor-panel {
  padding: 22px;
}

.admin-label {
  display: block;
  margin-bottom: 8px;
  color: var(--muted);
  font-weight: 850;
}

.admin-search {
  min-height: 54px;
  margin-bottom: 18px;
  font-size: 1rem;
}

.admin-select,
.admin-form input,
.admin-form textarea,
.admin-textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
}

.admin-select {
  min-height: 50px;
  margin-bottom: 18px;
}

.admin-textarea,
.admin-form textarea {
  resize: vertical;
}

.admin-textarea {
  font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font-size: 0.94rem;
  line-height: 1.55;
}

.admin-textarea.is-compact {
  min-height: 120px;
}

.admin-record-list {
  display: grid;
  gap: 10px;
  max-height: 720px;
  overflow-y: auto;
}

.admin-record {
  display: grid;
  gap: 4px;
  width: 100%;
  min-height: 76px;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  font: inherit;
  text-align: left;
  transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
}

.admin-record strong {
  font-size: 1rem;
  line-height: 1.35;
}

.admin-record span {
  color: var(--soft);
  font-size: 0.92rem;
}

.admin-record:hover,
.admin-record:focus-visible,
.admin-record.is-selected {
  border-color: transparent;
  background: var(--accent);
  color: #fffaf4;
  outline: none;
}

.admin-record:hover span,
.admin-record:focus-visible span,
.admin-record.is-selected span {
  color: var(--accent-soft);
}

.admin-empty {
  margin: 0;
  color: var(--muted);
}

.admin-empty.is-small {
  padding: 12px 0;
  font-size: 0.96rem;
}

.admin-form {
  display: grid;
  gap: 22px;
}

.admin-editor-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
}

.admin-kicker {
  color: var(--accent-strong);
  font-size: 0.92rem;
  font-weight: 850;
}

.admin-title {
  margin: 4px 0 0;
  color: var(--text);
  font-size: 1.45rem;
  line-height: 1.25;
}

.admin-inline-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 10px;
}

.admin-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.admin-grid label {
  display: grid;
  gap: 8px;
  color: var(--muted);
  font-weight: 850;
}

.admin-grid label span {
  font-size: 0.95rem;
}

.admin-grid .admin-wide {
  grid-column: 1 / -1;
}

.admin-form input:focus,
.admin-form textarea:focus,
.admin-select:focus,
.admin-textarea:focus {
  border-color: var(--accent);
  outline: 3px solid rgba(180, 95, 60, 0.16);
}

.admin-helper {
  margin: 0;
  color: var(--muted);
  font-size: 0.94rem;
}

.admin-helper.is-error {
  color: #9f3326;
}

.site-footer {
  padding: 20px 0 54px;
  color: var(--footer-text);
  font-size: 0.98rem;
  text-align: center;
}

.site-footer p {
  margin: 0;
  border-radius: 18px;
  padding: 18px 24px;
  background: var(--footer-bg);
}

@media (max-width: 900px) {
  .header-inner {
    grid-template-columns: 1fr;
    padding-top: 42px;
  }

  .library-stats {
    min-width: 0;
    width: 100%;
  }

  .course-nav {
    align-items: flex-start;
    flex-direction: column;
    gap: 12px;
  }

  .course-tabs {
    width: 100%;
    overflow-x: auto;
    padding-bottom: 2px;
